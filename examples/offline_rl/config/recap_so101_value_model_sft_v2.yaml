# Episode-held-out SO-101 ReCap value training.
# The same split seed/fraction on a dataset yields complementary train/eval
# episodes. Rollout episodes are stratified by success/timeout/failure.
defaults:
  - model/recap_value_model@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/offline_rl/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: sft
  logger:
    log_path: ../results
    project_name: rlinf
    experiment_name: recap_so101_value_sft_v2
    logger_backends: [tensorboard]
  max_epochs: -1
  max_steps: 6000
  val_check_interval: 250
  save_interval: 1000

data:
  tag: so101
  train_data_paths:
    - dataset_path: ${oc.env:SO101_RECAP_DEMO_DATASET,/mnt/pqssd/so101/datasets/merged_lerobot_dataset_with_dagger30_trimmed}
      type: sft
      weight: 1.0
      robot_type: so101
      model_type: pi05
      episode_split: train
      eval_fraction: 0.2
      episode_seed: 42
    - dataset_path: ${oc.env:SO101_RECAP_ROLLOUT_DATASET,/mnt/pqssd/so101/datasets/pi05_jax_rtc_rollouts_50_v3}
      type: rollout
      weight: 1.0
      robot_type: so101
      model_type: pi05
      episode_split: train
      eval_fraction: 0.2
      episode_seed: 42
      stratify_outcomes: true
  eval_data_paths:
    - name: demo90_holdout
      dataset_path: ${oc.env:SO101_RECAP_DEMO_DATASET,/mnt/pqssd/so101/datasets/merged_lerobot_dataset_with_dagger30_trimmed}
      robot_type: so101
      model_type: pi05
      episode_split: eval
      eval_fraction: 0.2
      episode_seed: 42
    - name: rollout50_holdout
      dataset_path: ${oc.env:SO101_RECAP_ROLLOUT_DATASET,/mnt/pqssd/so101/datasets/pi05_jax_rtc_rollouts_50_v3}
      robot_type: so101
      model_type: pi05
      episode_split: eval
      eval_fraction: 0.2
      episode_seed: 42
      stratify_outcomes: true
  train_num_workers: 8
  eval_num_workers: 2
  prefetch_factor: 4
  persistent_workers: false
  pin_memory: false
  include_state: true
  gamma: 1.0
  action_horizon: 50
  normalize_to_minus_one_zero: true
  include_next_obs: false
  action_dim: 6
  robot_type: so101
  model_type: pi05
  balance_weights: true
  seed: 42

algorithm:
  adv_type: gae

actor:
  group_name: ActorGroup
  training_backend: fsdp
  # RTX 3090: keep the per-forward batch small and recover an effective batch
  # of 32 through gradient accumulation (16 micro batches per optimizer step).
  micro_batch_size: 2
  global_batch_size: 32
  seed: 0
  model:
    precision: bf16
    siglip_path: ${oc.env:RECAP_SIGLIP_PATH,google/siglip2-so400m-patch14-224}
    gemma3_path: ${oc.env:RECAP_GEMMA_PATH,google/gemma-3-270m}
    tokenizer_path: ${oc.env:RECAP_GEMMA_PATH,google/gemma-3-270m}
    freeze_vlm: false
    action_dim: 6
    action_horizon: 50
  optim:
    lr: 3.0e-5
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-10
    clip_grad: 1.0
    lr_scheduler: cosine
    lr_warmup_steps: 300
    total_training_steps: ${runner.max_steps}
    min_lr_rate: 0.1
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    use_orig_params: false
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: false
critic:
  use_critic_model: false
