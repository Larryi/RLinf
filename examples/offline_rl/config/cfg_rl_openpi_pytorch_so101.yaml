defaults:
  - hybrid_engines/fsdp@actor.fsdp_config
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/offline_rl/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: sft
  logger:
    log_path: ../results
    project_name: rlinf
    experiment_name: recap_so101_cfg
    logger_backends: [tensorboard]
  max_epochs: 30000
  max_steps: -1
  val_check_interval: -1
  save_interval: 3000

data:
  num_workers: 1
  prefetch_factor: 1
  advantage_tag: so101_q30
  balance_dataset_weights: true
  seed: 42
  train_data_paths:
    - dataset_path: ${oc.env:SO101_RECAP_DEMO_DATASET,/mnt/pqssd/so101/datasets/merged_lerobot_dataset_with_dagger30_trimmed}
      type: sft
      weight: 1.0
    - dataset_path: ${oc.env:SO101_RECAP_ROLLOUT_DATASET,/mnt/pqssd/so101/datasets/pi05_jax_rtc_rollouts_50_v3}
      type: rollout
      weight: 1.0

algorithm:
  adv_type: gae

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 2
  global_batch_size: 8
  seed: 0
  # 3.35B Pi0 (frozen VLM + trainable expert) does not fit 24 GB on-GPU with
  # no_shard; offload the frozen VLM weights to CPU via fsdp_config.cpu_offload
  # (FSDP-native offload). Do NOT set actor.enable_offload here: the manual
  # load_param_and_grad path moves flat params to GPU and conflicts with FSDP's
  # CPUOffload (torch raises "parameters on cuda:0").
  model:
    model_type: openpi_pytorch
    model_path: ${oc.env:SO101_RECAP_POLICY_CHECKPOINT,/mnt/pqssd/so101/train_outputs/openpi_pi05/openpi-so101-pi05-60-30000/rlinf_ckpt}
    precision: bf16
    num_action_chunks: 50
    action_dim: 6
    use_proprio: true
    num_steps: 10
    add_value_head: false
    openpi:
      task: cfg
      config_name: pi05_so101
      model_action_dim: 32
      paligemma_variant: gemma_2b
      action_expert_variant: gemma_300m
      max_token_len: 200
      discrete_state_input: true
      action_chunk: ${..num_action_chunks}
      action_env_dim: ${..action_dim}
      unconditional_prob: 0.1
      positive_only_conditional: true
      train_expert_only: true
  optim:
    lr: 1.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-10
    clip_grad: 1.0
    lr_scheduler: cosine
    lr_warmup_steps: 5000
    total_training_steps: 30000
    min_lr: 0.0
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    # Required when frozen VLM and trainable action-expert parameters coexist.
    use_orig_params: true
    gradient_checkpointing: true
    # Offload the frozen VLM weights to CPU so the 3.35B model fits 24 GB.
    cpu_offload: true
    offload_pin_memory: false
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32

reward:
  use_reward_model: false
critic:
  use_critic_model: false
