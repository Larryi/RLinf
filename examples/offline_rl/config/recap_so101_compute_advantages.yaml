defaults:
  - model/recap_value_model@advantage.model
  - _self_

advantage:
  value_checkpoint: ${oc.env:RECAP_VALUE_CHECKPOINT}
  batch_size: 128
  flush_interval: 256
  num_dataloader_workers_per_gpu: 4
  prefetch_factor: 2
  discount_next_value: true
  positive_quantile: 0.3
  # Keep the sidecar name synchronized with CFG through one environment
  # variable. This prevents a new Value model from overwriting older labels.
  tag: ${oc.env:SO101_RECAP_ADVANTAGE_TAG,so101_q30}
  returns_tag: so101
  model:
    critic_expert_variant: gemma_1m
    tokenizer_path: ${oc.env:RECAP_GEMMA_PATH,google/gemma-3-270m}
    siglip_path: ${oc.env:RECAP_SIGLIP_PATH,google/siglip2-so400m-patch14-224}
    gemma3_path: ${oc.env:RECAP_GEMMA_PATH,google/gemma-3-270m}

data:
  model_type: pi05
  train_data_paths:
    - dataset_path: ${oc.env:SO101_RECAP_DEMO_DATASET,/mnt/pqssd/so101/datasets/merged_lerobot_dataset_with_dagger30_trimmed}
      robot_type: so101
      type: sft
      weight: 1.0
    - dataset_path: ${oc.env:SO101_RECAP_ROLLOUT_DATASET,/mnt/pqssd/so101/datasets/pi05_jax_rtc_rollouts_50_v3}
      robot_type: so101
      type: rollout
      weight: 1.0
  advantage_lookahead_step: 10
  gamma: 1.0

distributed:
  enabled: true
  backend: nccl
  timeout: 3600

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:REPO_PATH}/examples/offline_rl/config/
  job:
    chdir: false
